<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Developers Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">DevClub</div>
        <button id="logoutBtn" class="btn btn-glass">Logout</button>
    </nav>
    <div class="container" style="justify-content: flex-start;">
        <div class="dashboard-header">
            <h2>Welcome to your Workspace</h2>
            <div id="roleBadge" class="badge"></div>
        </div>

        <div id="memberView" class="hidden">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('active')">Active</button>
                <button class="tab-btn" onclick="switchTab('submitted')">Submitted (Under Review)</button>
                <button class="tab-btn" onclick="switchTab('archived')">Archived (Reviewed)</button>
            </div>
            
            <div id="tab-active" class="tab-content active-tab card-grid"></div>
            <div id="tab-submitted" class="tab-content card-grid"></div>
            <div id="tab-archived" class="tab-content card-grid"></div>
        </div>

        <div id="leaderView" class="leader-section hidden" style="margin-top: 0; padding-top: 0; border: none;">
            <h3>Leader Control Panel</h3>
            <div class="card-grid" style="margin-bottom: 3rem;">
                <div class="glass-panel" style="padding: 2rem;">
                    <h4>Assign New Objective</h4>
                    <form id="postJobForm" style="margin-top: 1rem;">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="jobTitle" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Description (Optional)</label>
                            <input type="text" id="jobDesc" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Assignee</label>
                            <select id="assigneeSelect" class="form-control" required>
                                <option value="">Loading members...</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%">Post Objective</button>
                        <div id="jobError" class="error-text"></div>
                    </form>
                </div>
            </div>
            
            <h3>All Members & Objectives</h3>
            <div id="allMembersGrid" class="card-grid"></div>
        </div>
    </div>

    <script>
        const role = localStorage.getItem('role');
        if (!role) {
            window.location.href = '/login.html';
        }

        document.getElementById('roleBadge').textContent = role.toUpperCase();
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.cookie = "userId=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "userRole=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            localStorage.removeItem('role');
            window.location.href = '/';
        });

        if (role === 'leader') {
            document.getElementById('leaderView').classList.remove('hidden');
            fetchLeaderData();

            document.getElementById('postJobForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('jobTitle').value;
                const desc = document.getElementById('jobDesc').value;
                const assigneeId = document.getElementById('assigneeSelect').value;

                try {
                    const res = await fetch('/api/admin/jobs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, description: desc, assigned_to_user_id: assigneeId })
                    });
                    if (res.ok) {
                        document.getElementById('postJobForm').reset();
                        fetchLeaderData(); // Refresh overview
                    } else {
                        const err = await res.json();
                        document.getElementById('jobError').textContent = err.error || 'Failed to post';
                        document.getElementById('jobError').style.display = 'block';
                    }
                } catch(e) {
                    console.error(e);
                }
            });
        } else {
            document.getElementById('memberView').classList.remove('hidden');
            fetchMemberData();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active-tab'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active-tab');
        }

        async function submitProof(e, jobId) {
            e.preventDefault();
            const fileInput = e.target.querySelector('input[type="file"]');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('proofImage', fileInput.files[0]);

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Uploading...';
            btn.disabled = true;

            try {
                const res = await fetch(`/api/jobs/${jobId}/submit`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    fetchMemberData(); // Refresh to move task to submitted
                } else {
                    alert('Failed to upload assignment.');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function archiveJob(jobId) {
            try {
                const res = await fetch(`/api/admin/jobs/${jobId}/archive`, {
                    method: 'POST'
                });
                if (res.ok) {
                    fetchLeaderData(); // Refresh member data grid
                } else {
                    alert('Failed to archive job.');
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function fetchMemberData() {
            try {
                const res = await fetch('/api/jobs');
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('role');
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                
                const activeGrid = document.getElementById('tab-active');
                const submittedGrid = document.getElementById('tab-submitted');
                const archivedGrid = document.getElementById('tab-archived');
                
                activeGrid.innerHTML = '';
                submittedGrid.innerHTML = '';
                archivedGrid.innerHTML = '';

                let activeCount = 0, submittedCount = 0, archivedCount = 0;

                if (data.jobs && data.jobs.length > 0) {
                    data.jobs.forEach(job => {
                        let innerHtml = `
                            <div class="job-card">
                                <div class="job-title">${job.title}</div>
                                <div class="job-desc">${job.description || ''}</div>
                                <div class="job-meta">Objective ID: #${job.id} | Status: ${job.status.toUpperCase()}</div>
                                ${job.proof_image_url ? `<img src="${job.proof_image_url}" class="proof-img" alt="Proof">` : ''}
                        `;

                        if (job.status === 'active') {
                            activeCount++;
                            innerHtml += `
                                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                                    <form onsubmit="submitProof(event, ${job.id});" style="display:flex; flex-direction:column; gap:0.5rem">
                                        <label style="font-size:0.85rem; color:var(--text-muted);">Upload Proof to Turn In</label>
                                        <input type="file" required accept="image/*" class="form-control" style="font-size: 0.85rem; padding: 0.5rem;">
                                        <button type="submit" class="btn btn-primary" style="font-size: 0.9rem; padding: 0.5rem;">Turn In Assignment</button>
                                    </form>
                                </div>
                            `;
                            activeGrid.innerHTML += innerHtml + '</div>';
                        } else if (job.status === 'submitted') {
                            submittedCount++;
                            submittedGrid.innerHTML += innerHtml + '</div>';
                        } else if (job.status === 'archived') {
                            archivedCount++;
                            archivedGrid.innerHTML += innerHtml + '</div>';
                        }
                    });
                }

                if (activeCount === 0) activeGrid.innerHTML = '<p style="color:var(--text-muted)">No active objectives.</p>';
                if (submittedCount === 0) submittedGrid.innerHTML = '<p style="color:var(--text-muted)">No submitted objectives.</p>';
                if (archivedCount === 0) archivedGrid.innerHTML = '<p style="color:var(--text-muted)">No archived objectives.</p>';

            } catch(e) {
                console.error(e);
            }
        }

        async function fetchLeaderData() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('role');
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                const grid = document.getElementById('allMembersGrid');
                const select = document.getElementById('assigneeSelect');
                
                grid.innerHTML = '';
                select.innerHTML = '<option value="">Select a member...</option>';

                data.users.forEach(user => {
                    select.innerHTML += `<option value="${user.id}">${user.username} (${user.role})</option>`;
                    
                    let jobsHTML = '';
                    if (user.jobs && user.jobs.length > 0) {
                        const sortedJobs = user.jobs.sort((a,b) => {
                            if (a.status === 'submitted' && b.status !== 'submitted') return -1;
                            if (b.status === 'submitted' && a.status !== 'submitted') return 1;
                            return 0;
                        });

                        sortedJobs.forEach(job => {
                            const isSubmitted = job.status === 'submitted';
                            jobsHTML += `
                            <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border: ${isSubmitted ? '1px solid var(--accent-glow-secondary)' : 'none'};">
                                <div style="display:flex; justify-content: space-between;">
                                    <strong style="color: #fff">${job.title}</strong>
                                    <span style="font-size: 0.8rem; color:${isSubmitted ? 'var(--accent-glow-secondary)' : 'var(--text-muted)'}">${job.status.toUpperCase()}</span>
                                </div>
                                <div style="font-size: 0.85rem">${job.description || ''}</div>
                                ${job.proof_image_url ? `<img src="${job.proof_image_url}" class="proof-img" alt="Proof">` : ''}
                                ${isSubmitted ? `<button onclick="archiveJob(${job.id})" class="btn btn-primary" style="font-size: 0.8rem; padding: 0.4rem 1rem; margin-top: 0.8rem; width: 100%">Mark as Reviewed (Archive)</button>` : ''}
                            </div>`;
                        });
                    } else {
                        jobsHTML = `<div style="margin-top: 10px; color: var(--text-muted); font-size: 0.9rem;">No active objectives</div>`;
                    }

                    grid.innerHTML += `
                        <div class="glass-panel" style="padding: 1.5rem">
                            <div style="display:flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; margin-bottom: 1rem;">
                                <h4 style="margin: 0; font-size: 1.3rem;">${user.username}</h4>
                                <span class="badge">${user.role}</span>
                            </div>
                            <div style="font-size: 0.9rem; color: var(--text-muted)">Current Tasks:</div>
                            ${jobsHTML}
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
