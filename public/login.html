<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login - DevClub</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<nav>
			<div class="logo">DevClub</div>
			<a href="index.html" class="btn btn-glass">Back to Home</a>
		</nav>
		<div class="container">
			<div class="glass-panel">
				<h2 style="font-size: 2rem; margin-bottom: 2rem; text-align: center">
					Secure Login
				</h2>
				<form id="loginForm">
					<div class="form-group">
						<label>Username</label>
						<input
							type="text"
							id="username"
							class="form-control"
							required
							placeholder="username"
						/>
					</div>
					<div class="form-group">
						<label>Password</label>
						<input
							type="password"
							id="password"
							class="form-control"
							required
							placeholder="password"
						/>
					</div>
					<div id="errorMsg" class="error-text"></div>
					<button
						type="submit"
						class="btn btn-primary"
						style="width: 100%; margin-top: 1rem"
					>
						Authenticate
					</button>
				</form>
			</div>
		</div>

		<script>
			document.getElementById("loginForm").addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = document.getElementById("username").value;
				const password = document.getElementById("password").value;
				const errorMsg = document.getElementById("errorMsg");

				errorMsg.style.display = "none";

				try {
					const res = await fetch("/api/login", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ username, password }),
					});

					const data = await res.json();

					if (res.ok) {
						localStorage.setItem("role", data.role);
						window.location.href = "/dashboard.html";
					} else {
						errorMsg.textContent = data.error || "Authentication failed";
						errorMsg.style.display = "block";
					}
				} catch (e) {
					errorMsg.textContent = "Network error. Please try again.";
					errorMsg.style.display = "block";
				}
			});
		</script>
	</body>
</html>
