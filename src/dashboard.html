<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard - Developers Club</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			.timeline {
				padding-left: 1rem;
				border-left: 2px solid var(--accent-glow);
				margin-top: 1rem;
			}
			.timeline-event {
				margin-bottom: 1rem;
				position: relative;
			}
			.timeline-event::before {
				content: "";
				position: absolute;
				left: -1.3rem;
				top: 5px;
				width: 10px;
				height: 10px;
				background: var(--accent-glow-secondary);
				border-radius: 50%;
			}
			.small-input {
				padding: 0.5rem;
				font-size: 0.85rem;
				margin-bottom: 0.5rem;
			}
			.delete-btn {
				background: rgba(255, 50, 50, 0.2);
				color: #ff8888;
				border: 1px solid #ff4444;
				padding: 0.4rem 1rem;
				border-radius: 20px;
				font-size: 0.8rem;
				cursor: pointer;
				transition: 0.3s;
			}
			.delete-btn:hover {
				background: rgba(255, 50, 50, 0.4);
			}
			.accept-btn {
				background: rgba(50, 200, 100, 0.2);
				color: #66ff99;
				border: 1px solid #44cc66;
				padding: 0.4rem 1rem;
				border-radius: 20px;
				font-size: 0.8rem;
				cursor: pointer;
				transition: 0.3s;
			}
			.accept-btn:hover {
				background: rgba(50, 200, 100, 0.4);
			}
			.reject-btn {
				background: rgba(255, 170, 50, 0.2);
				color: #ffcc66;
				border: 1px solid #cc9933;
				padding: 0.4rem 1rem;
				border-radius: 20px;
				font-size: 0.8rem;
				cursor: pointer;
				transition: 0.3s;
			}
			.reject-btn:hover {
				background: rgba(255, 170, 50, 0.4);
			}
			.review-actions {
				display: flex;
				gap: 0.5rem;
				margin-top: 0.75rem;
			}
			.review-actions button {
				flex: 1;
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="logo">DevClub Portal</div>
			<button id="logoutBtn" class="btn btn-glass">Logout</button>
		</nav>
		<div class="container dashboard-container" style="justify-content: flex-start">
			<div class="dashboard-header" style="margin-bottom: 1rem">
				<h2>Welcome to your Workspace</h2>
				<div id="roleBadge" class="badge"></div>
			</div>

			<div class="tabs" style="margin-bottom: 2rem">
				<button id="btn-workspace" class="tab-btn active" onclick="switchMain('workspace')">
					My Workspace
				</button>
				<button id="btn-teams" class="tab-btn" onclick="switchMain('teams')">Teams</button>
				<button id="btn-users" class="tab-btn hidden" onclick="switchMain('users')">
					Manage Users
				</button>
			</div>

			<!-- WORKSPACE TAB -->
			<div id="nav-workspace" style="display: block">
				<div id="memberView" class="hidden">
					<div class="tabs">
						<button class="tab-btn active" onclick="switchTab('active')">Active</button>
						<button class="tab-btn" onclick="switchTab('submitted')">
							Submitted (Under Review)
						</button>
						<button class="tab-btn" onclick="switchTab('archived')">
							Archived (Completed)
						</button>
					</div>
					<div id="tab-active" class="tab-content active-tab card-grid"></div>
					<div id="tab-submitted" class="tab-content card-grid"></div>
					<div id="tab-archived" class="tab-content card-grid"></div>
				</div>

				<div
					id="leaderView"
					class="leader-section hidden"
					style="margin-top: 0; padding-top: 0; border: none"
				>
					<h3>Assign Individual Objective</h3>
					<div class="card-grid" style="margin-bottom: 3rem">
						<div class="glass-panel" style="padding: 2rem">
							<form id="postJobForm">
								<div class="form-group">
									<label>Title</label>
									<input
										type="text"
										id="jobTitle"
										class="form-control"
										required
									/>
								</div>
								<div class="form-group">
									<label>Description (Optional)</label>
									<input type="text" id="jobDesc" class="form-control" />
								</div>
								<div class="form-group">
									<label id="assigneeLabel">Assignee</label>
									<select id="assigneeSelect" class="form-control" required>
										<option value="">Loading...</option>
									</select>
								</div>
								<button type="submit" class="btn btn-primary" style="width: 100%">
									Post Objective
								</button>
								<div id="jobError" class="error-text"></div>
							</form>
						</div>
					</div>
					<h3>All Users & Objectives</h3>
					<div id="allMembersGrid" class="card-grid"></div>
				</div>
			</div>

			<!-- TEAMS TAB -->
			<div id="nav-teams" style="display: none">
				<!-- Chief Lead Teams View -->
				<div id="chiefTeamsView" class="hidden">
					<h3>Team Builder</h3>
					<div
						class="glass-panel"
						style="padding: 1.5rem; max-width: 600px; margin-bottom: 2rem"
					>
						<form id="createTeamForm" style="display: flex; gap: 1rem">
							<input
								type="text"
								id="newTeamName"
								class="form-control"
								placeholder="New Team Name"
								required
							/>
							<button type="submit" class="btn btn-primary">Create</button>
						</form>
					</div>
					<div id="chiefTeamsGrid" class="card-grid"></div>
				</div>

				<!-- Standard Teams View (Leader/Member) -->
				<div id="standardTeamsView" class="hidden">
					<h3>My Teams Portfolio</h3>
					<div id="myTeamsGrid" class="card-grid"></div>
				</div>
			</div>

			<!-- USERS TAB (Chief Lead only) -->
			<div id="nav-users" style="display: none">
				<h3>User Management</h3>
				<div
					class="glass-panel"
					style="padding: 2rem; max-width: 600px; margin-bottom: 2rem"
				>
					<h4>Create New User</h4>
					<form id="createUserForm">
						<div class="form-group">
							<label>Username</label>
							<input type="text" id="newUsername" class="form-control" required />
						</div>
						<div class="form-group">
							<label>Password</label>
							<input type="password" id="newPassword" class="form-control" required />
						</div>
						<div class="form-group">
							<label>Role</label>
							<select id="newRole" class="form-control">
								<option value="member">Member</option>
								<option value="leader">Leader</option>
								<option value="chief_lead">Chief Lead</option>
							</select>
						</div>
						<button type="submit" class="btn btn-primary" style="width: 100%">
							Create User
						</button>
						<div id="userError" class="error-text"></div>
					</form>
				</div>
				<div id="usersListGrid" class="card-grid"></div>
			</div>
		</div>

		<script>
			const role = localStorage.getItem("role");
			if (!role) window.location.href = "/login.html";

			// Read logged-in user's ID from cookie for ownership checks
			const myUserId = document.cookie
				.split("; ")
				.find((r) => r.startsWith("userId="))
				?.split("=")[1];

			document.getElementById("roleBadge").textContent = role.replace("_", " ").toUpperCase();
			document.getElementById("logoutBtn").addEventListener("click", () => {
				document.cookie = "userId=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
				document.cookie = "userRole=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
				localStorage.removeItem("role");
				window.location.href = "/";
			});

			// ==================== ROLE-BASED UI SETUP ====================
			if (role === "chief_lead") {
				document.getElementById("btn-users").classList.remove("hidden");
				document.getElementById("chiefTeamsView").classList.remove("hidden");
				document.getElementById("leaderView").classList.remove("hidden");
				document.getElementById("memberView").classList.remove("hidden");
				document.getElementById("standardTeamsView").classList.remove("hidden");
				document.getElementById("assigneeLabel").textContent =
					"Assignee (Leaders & Members)";
				fetchLeaderWorkspace();
				fetchChiefTeams();
				fetchUsersList();
				fetchMemberWorkspace();
				fetchMyTeams();
			} else if (role === "leader") {
				document.getElementById("leaderView").classList.remove("hidden");
				document.getElementById("standardTeamsView").classList.remove("hidden");
				document.getElementById("memberView").classList.remove("hidden");
				document.getElementById("assigneeLabel").textContent = "Assignee (Members Only)";
				fetchLeaderWorkspace();
				fetchMyTeams();
				fetchMemberWorkspace();
			} else {
				document.getElementById("memberView").classList.remove("hidden");
				document.getElementById("standardTeamsView").classList.remove("hidden");
				fetchMemberWorkspace();
				fetchMyTeams();
			}

			// ==================== TAB SWITCHING ====================
			function switchMain(section) {
				["workspace", "teams", "users"].forEach((id) => {
					const el = document.getElementById("nav-" + id);
					if (el) el.style.display = "none";
					const btn = document.getElementById("btn-" + id);
					if (btn) btn.classList.remove("active");
				});
				document.getElementById("nav-" + section).style.display = "block";
				document.getElementById("btn-" + section).classList.add("active");
			}

			function switchTab(tabId) {
				document
					.querySelectorAll("#memberView .tab-btn")
					.forEach((btn) => btn.classList.remove("active"));
				document
					.querySelectorAll("#memberView .tab-content")
					.forEach((tab) => tab.classList.remove("active-tab"));
				event.target.classList.add("active");
				document.getElementById(`tab-${tabId}`).classList.add("active-tab");
			}

			// ==================== POST INDIVIDUAL OBJECTIVE ====================
			if (role === "leader" || role === "chief_lead") {
				document.getElementById("postJobForm").addEventListener("submit", async (e) => {
					e.preventDefault();
					const title = document.getElementById("jobTitle").value;
					const desc = document.getElementById("jobDesc").value;
					const assigneeId = document.getElementById("assigneeSelect").value;
					try {
						const res = await fetch("/api/admin/jobs", {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({
								title,
								description: desc,
								assigned_to_user_id: assigneeId,
							}),
						});
						if (res.ok) {
							document.getElementById("postJobForm").reset();
							document.getElementById("jobError").style.display = "none";
							fetchLeaderWorkspace();
							fetchMemberWorkspace();
						} else {
							const err = await res.json();
							document.getElementById("jobError").textContent =
								err.error || "Failed to assign";
							document.getElementById("jobError").style.display = "block";
						}
					} catch (e) {
						console.error(e);
					}
				});
			}

			// ==================== LEADER/CHIEF WORKSPACE (Review Panel) ====================
			async function fetchLeaderWorkspace() {
				try {
					const res = await fetch("/api/admin/users");
					if (res.status === 401 || res.status === 403)
						return (window.location.href = "/login.html");
					const data = await res.json();

					const grid = document.getElementById("allMembersGrid");
					const select = document.getElementById("assigneeSelect");
					grid.innerHTML = "";
					select.innerHTML = '<option value="">Select assignee...</option>';

					data.users.forEach((user) => {
						// Chief leads: populate dropdown with leaders + members (not chief_leads)
						// Leaders: populate dropdown with members only
						if (role === "chief_lead" && user.role !== "chief_lead") {
							select.innerHTML += `<option value="${user.id}">${user.username} (${user.role})</option>`;
						} else if (role === "leader" && user.role === "member") {
							select.innerHTML += `<option value="${user.id}">${user.username} (${user.role})</option>`;
						}

						let jobsHTML = "";
						if (user.jobs && user.jobs.length > 0) {
							const sortedJobs = user.jobs.sort((a, b) =>
								a.status === "submitted" ? -1 : 1,
							);
							sortedJobs.forEach((job) => {
								if (job.team_id !== null) return; // Team jobs are reviewed in the Teams tab
								const isSubmitted = job.status === "submitted";
								const isCreator = String(job.created_by) === String(myUserId);
								const canReview = role === "chief_lead" || isCreator;

								jobsHTML += `
                            <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border: ${isSubmitted ? "1px solid var(--accent-glow-secondary)" : "none"};">
                                <div style="display:flex; justify-content: space-between;">
                                    <strong style="color: #fff">${job.title}</strong>
                                    <span style="font-size: 0.8rem; color:${isSubmitted ? "var(--accent-glow-secondary)" : "var(--text-muted)"}">${job.status === "archived" ? "COMPLETED" : job.status.toUpperCase()}</span>
                                </div>
                                <div style="font-size: 0.85rem">${job.description || ""}</div>
                                ${job.proof_image_url ? `<img src="${job.proof_image_url}" class="proof-img">` : ""}
                                ${
									isSubmitted && canReview
										? `
                                <div class="review-actions">
                                    <button onclick="acceptJob(${job.id})" class="accept-btn">✓ Accept</button>
                                    <button onclick="rejectJob(${job.id})" class="reject-btn">✗ Reject</button>
                                </div>`
										: ""
								}
                                ${isCreator ? `<button onclick="deleteJob(${job.id})" class="delete-btn" style="margin-top:0.5rem; width:100%">🗑 Delete Objective</button>` : ""}
                            </div>`;
							});
						}
						if (!jobsHTML)
							jobsHTML = `<div style="margin-top: 10px; color: var(--text-muted); font-size: 0.9rem;">No individual objectives</div>`;

						grid.innerHTML += `
                        <div class="glass-panel" style="padding: 1.5rem">
                            <div style="display:flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; margin-bottom: 1rem;">
                                <h4 style="margin: 0; font-size: 1.3rem;">${user.username}</h4>
                                <span class="badge">${user.role}</span>
                            </div>
                            ${jobsHTML}
                        </div>
                    `;
					});
				} catch (e) {
					console.error(e);
				}
			}

			// ==================== REVIEW ACTIONS ====================
			async function acceptJob(jobId) {
				try {
					const res = await fetch(`/api/admin/jobs/${jobId}/accept`, { method: "POST" });
					if (res.ok) {
						refreshAll();
					} else {
						const d = await res.json();
						alert(d.error);
					}
				} catch (e) {
					console.error(e);
				}
			}

			async function rejectJob(jobId) {
				if (!confirm("Reject this submission? It will be pushed back to active.")) return;
				try {
					const res = await fetch(`/api/admin/jobs/${jobId}/reject`, { method: "POST" });
					if (res.ok) {
						refreshAll();
					} else {
						const d = await res.json();
						alert(d.error);
					}
				} catch (e) {
					console.error(e);
				}
			}

			async function deleteJob(jobId) {
				if (!confirm("Delete this objective permanently?")) return;
				try {
					const res = await fetch(`/api/jobs/${jobId}`, { method: "DELETE" });
					if (res.ok) {
						refreshAll();
					} else {
						const d = await res.json();
						alert(d.error);
					}
				} catch (e) {
					console.error(e);
				}
			}

			function refreshAll() {
				if (role === "leader" || role === "chief_lead") fetchLeaderWorkspace();
				fetchMemberWorkspace();
				fetchMyTeams();
				if (role === "chief_lead") fetchChiefTeams();
			}

			// ==================== MEMBER WORKSPACE (Own Objectives) ====================
			async function fetchMemberWorkspace() {
				try {
					const res = await fetch("/api/jobs");
					if (res.status === 401 || res.status === 403)
						return (window.location.href = "/login.html");
					const data = await res.json();

					const activeG = document.getElementById("tab-active");
					const submitG = document.getElementById("tab-submitted");
					const arcG = document.getElementById("tab-archived");
					activeG.innerHTML = submitG.innerHTML = arcG.innerHTML = "";
					let aC = 0,
						sC = 0,
						arC = 0;

					data.jobs.forEach((job) => {
						let inner = `
                        <div class="job-card">
                            <div class="job-title">${job.title} ${job.team_id ? '<span style="color:var(--accent-glow); font-size:0.8rem">(Team Task)</span>' : ""}</div>
                            <div class="job-desc">${job.description || ""}</div>
                            <div class="job-meta">Status: ${job.status === "archived" ? "COMPLETED" : job.status.toUpperCase()}</div>
                            ${job.proof_image_url ? `<img src="${job.proof_image_url}" class="proof-img">` : ""}
                    `;
						if (job.status === "active") {
							aC++;
							inner += `
                            <form onsubmit="submitProof(event, ${job.id});" style="margin-top: 1rem;">
                                <input type="file" required accept="image/*" class="form-control small-input">
                                <button type="submit" class="btn btn-primary small-input">Turn In Proof</button>
                            </form></div>`;
							activeG.innerHTML += inner;
						} else if (job.status === "submitted") {
							sC++;
							submitG.innerHTML += inner + "</div>";
						} else {
							arC++;
							arcG.innerHTML += inner + "</div>";
						}
					});

					if (aC === 0)
						activeG.innerHTML =
							'<p class="error-text" style="display:block; color:var(--text-muted);">No active tasks.</p>';
					if (sC === 0)
						submitG.innerHTML =
							'<p class="error-text" style="display:block; color:var(--text-muted);">No submitted tasks.</p>';
					if (arC === 0)
						arcG.innerHTML =
							'<p class="error-text" style="display:block; color:var(--text-muted);">No completed tasks.</p>';
				} catch (e) {
					console.error(e);
				}
			}

			async function submitProof(e, jobId) {
				e.preventDefault();
				const form = new FormData();
				form.append("proofImage", e.target.querySelector('input[type="file"]').files[0]);
				try {
					const res = await fetch(`/api/jobs/${jobId}/submit`, {
						method: "POST",
						body: form,
					});
					if (res.ok) {
						refreshAll();
					}
				} catch (e) {
					console.error(e);
				}
			}

			// ==================== CHIEF LEAD: TEAM BUILDER ====================
			if (role === "chief_lead") {
				document.getElementById("createTeamForm").addEventListener("submit", async (e) => {
					e.preventDefault();
					await fetch("/api/teams", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({
							name: document.getElementById("newTeamName").value,
						}),
					});
					document.getElementById("createTeamForm").reset();
					fetchChiefTeams();
				});
			}

			async function fetchChiefTeams() {
				try {
					const res = await fetch("/api/teams");
					const usersRes = await fetch("/api/users");
					if (!res.ok || !usersRes.ok) return;
					const { teams } = await res.json();
					const { users } = await usersRes.json();
					const grid = document.getElementById("chiefTeamsGrid");
					grid.innerHTML = "";

					// Only show non-chief_lead users for team assignment
					let uOpts = `<option value="">Select user...</option>`;
					users
						.filter((u) => u.role !== "chief_lead")
						.forEach(
							(u) =>
								(uOpts += `<option value="${u.id}">${u.username} (${u.role})</option>`),
						);

					teams.forEach((t) => {
						let mList = t.members
							.map(
								(m) =>
									`<div style="font-size:0.9rem; margin-top:5px;">• ${m.username} <span style="color:var(--text-muted)">(${m.role_in_team})</span></div>`,
							)
							.join("");
						grid.innerHTML += `
                        <div class="glass-panel" style="padding: 1.5rem">
                            <h4 style="margin: 0 0 1rem; border-bottom:1px solid var(--glass-border); padding-bottom:1rem;">${t.name}</h4>
                            <div style="margin-bottom:1rem;">${mList || '<span style="color:var(--text-muted); font-size:0.9rem">No members yet.</span>'}</div>
                            
                            <form onsubmit="assignToTeam(event, ${t.id})" style="display:flex; flex-direction:column; gap:0.5rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius:10px;">
                                <label style="font-size:0.8rem">Assign to team</label>
                                <select class="form-control small-input" required>${uOpts}</select>
                                <select class="form-control small-input" required>
                                    <option value="member">As Member</option><option value="leader">As Leader</option>
                                </select>
                                <button type="submit" class="btn btn-primary small-input">Assign</button>
                            </form>
                        </div>
                    `;
					});
				} catch (e) {}
			}

			async function assignToTeam(e, tId) {
				e.preventDefault();
				const uId = e.target.querySelectorAll("select")[0].value;
				const rIt = e.target.querySelectorAll("select")[1].value;
				await fetch(`/api/teams/${tId}/members`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ user_id: uId, role_in_team: rIt }),
				});
				fetchChiefTeams();
				fetchMyTeams();
			}

			// ==================== MY TEAMS (Leader & Member) ====================
			async function fetchMyTeams() {
				try {
					const res = await fetch("/api/teams/my-teams");
					if (!res.ok) return;
					const { teams } = await res.json();
					const grid = document.getElementById("myTeamsGrid");
					grid.innerHTML = "";

					teams.forEach((t) => {
						const isTeamLeader = t.role_in_team === "leader";

						// Team objectives with review buttons for leaders
						let jList = t.jobs
							.map((j) => {
								const statusLabel =
									j.status === "archived" ? "COMPLETED" : j.status.toUpperCase();
								const isSubmitted = j.status === "submitted";
								const isCreator = String(j.created_by) === String(myUserId);
								const canReviewTeam = isTeamLeader || role === "chief_lead";

								let reviewHTML = "";
								if (isSubmitted && canReviewTeam) {
									reviewHTML = `<div class="review-actions">
                                <button onclick="acceptJob(${j.id})" class="accept-btn">✓ Accept</button>
                                <button onclick="rejectJob(${j.id})" class="reject-btn">✗ Reject</button>
                            </div>`;
								}
								let deleteHTML = "";
								if (isCreator) {
									deleteHTML = `<button onclick="deleteJob(${j.id})" class="delete-btn" style="margin-top:0.5rem; width:100%">🗑 Delete Objective</button>`;
								}

								return `<div style="background: rgba(0,0,0,0.2); padding:10px; margin-top:5px; border-radius:8px; border: ${isSubmitted ? "1px solid var(--accent-glow-secondary)" : "none"};">
                        <div style="display:flex; justify-content:space-between;">
                            <strong style="color:#fff">${j.title}</strong>
                            <span style="font-size:0.8rem; color:var(--accent-glow-secondary)">[${statusLabel}]</span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--text-muted)">${j.description || ""}</div>
                        ${j.proof_image_url ? `<img src="${j.proof_image_url}" class="proof-img">` : ""}
                        ${reviewHTML}
                        ${deleteHTML}
                    </div>`;
							})
							.join("");

						// Timeline events
						let eList = t.events
							.map(
								(ev) => `<div class="timeline-event">
                        <strong style="color:#fff">${ev.title}</strong>
                        <div style="font-size:0.8rem; color:var(--text-muted)">${ev.start_date || "?"} to ${ev.end_date || "?"}</div>
                    </div>`,
							)
							.join("");

						// Leader-only forms: post team jobs, add events, add members
						let leaderForms = "";
						if (isTeamLeader) {
							leaderForms = `
                        <div style="display:flex; gap:1rem; margin-top:1.5rem; flex-wrap:wrap;">
                            <form onsubmit="postTeamJob(event, ${t.id})" style="flex:1; min-width:200px; background:var(--glass-bg); padding:1rem; border-radius:8px;">
                                <h5>Post Team Objective</h5>
                                <input type="text" placeholder="Title" required class="form-control small-input">
                                <input type="text" placeholder="Desc" class="form-control small-input">
                                <button type="submit" class="btn btn-primary small-input" style="width:100%">Post</button>
                            </form>
                            <form onsubmit="postTeamEvent(event, ${t.id})" style="flex:1; min-width:200px; background:var(--glass-bg); padding:1rem; border-radius:8px;">
                                <h5>Add Calendar Event</h5>
                                <input type="text" placeholder="Event Title" required class="form-control small-input">
                                <div style="display:flex; gap:0.5rem;"><input type="date" required class="form-control small-input"><input type="date" required class="form-control small-input"></div>
                                <button type="submit" class="btn btn-primary small-input" style="width:100%">Add</button>
                            </form>
                            <form onsubmit="addMemberToTeam(event, ${t.id})" style="flex:1; min-width:200px; background:var(--glass-bg); padding:1rem; border-radius:8px;">
                                <h5>Add Member to Team</h5>
                                <select class="form-control small-input leader-member-select" data-team="${t.id}" required><option value="">Loading...</option></select>
                                <button type="submit" class="btn btn-primary small-input" style="width:100%">Add</button>
                            </form>
                        </div>
                        `;
						}

						// Team member list
						let membersList = t.members
							.map(
								(m) =>
									`<span style="background:rgba(255,255,255,0.05); padding:3px 10px; border-radius:20px; font-size:0.8rem; border:1px solid var(--glass-border);">${m.username} (${m.role_in_team})</span>`,
							)
							.join(" ");

						grid.innerHTML += `
                        <div class="glass-panel" style="padding: 1.5rem">
                            <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--glass-border); padding-bottom:1rem; margin-bottom:1rem;">
                                <h4 style="margin: 0; font-size: 1.5rem;">${t.name} <span style="font-size:0.8rem; font-weight:400; color:var(--text-muted)">(Your Role: ${t.role_in_team})</span></h4>
                            </div>

                            <div style="margin-bottom:1rem; display:flex; flex-wrap:wrap; gap:0.5rem;">${membersList}</div>
                            
                            <h5 style="color:var(--text-muted); margin-bottom:0.5rem;">Team Timeline</h5>
                            <div class="timeline">${eList || '<span style="color:var(--text-muted); font-size:0.85rem">No events mapped.</span>'}</div>
                            
                            <h5 style="color:var(--text-muted); margin-top:1.5rem; margin-bottom:0.5rem;">Team Global Objectives</h5>
                            <div>${jList || '<span style="color:var(--text-muted); font-size:0.85rem">No team tasks.</span>'}</div>

                            ${leaderForms}
                        </div>
                    `;
					});

					if (teams.length === 0)
						grid.innerHTML = `<span style="color:var(--text-muted)">You are not assigned to any teams yet.</span>`;

					// Populate leader member-add dropdowns
					if (role === "leader") {
						try {
							const mRes = await fetch("/api/members-list");
							if (mRes.ok) {
								const { members } = await mRes.json();
								document
									.querySelectorAll(".leader-member-select")
									.forEach((sel) => {
										sel.innerHTML =
											'<option value="">Select member...</option>';
										members.forEach(
											(m) =>
												(sel.innerHTML += `<option value="${m.id}">${m.username}</option>`),
										);
									});
							}
						} catch (e) {}
					}
				} catch (e) {}
			}

			async function postTeamJob(e, tId) {
				e.preventDefault();
				const i = e.target.querySelectorAll("input");
				await fetch(`/api/admin/teams/${tId}/jobs`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ title: i[0].value, description: i[1].value }),
				});
				e.target.reset();
				refreshAll();
			}

			async function postTeamEvent(e, tId) {
				e.preventDefault();
				const i = e.target.querySelectorAll("input");
				await fetch(`/api/admin/teams/${tId}/events`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						title: i[0].value,
						start_date: i[1].value,
						end_date: i[2].value,
					}),
				});
				e.target.reset();
				fetchMyTeams();
			}

			async function addMemberToTeam(e, tId) {
				e.preventDefault();
				const userId = e.target.querySelector("select").value;
				const res = await fetch(`/api/leader/teams/${tId}/members`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ user_id: userId }),
				});
				if (res.ok) {
					fetchMyTeams();
				} else {
					const d = await res.json();
					alert(d.error);
				}
			}

			// ==================== USER MANAGEMENT (Chief Lead) ====================
			if (role === "chief_lead") {
				document.getElementById("createUserForm").addEventListener("submit", async (e) => {
					e.preventDefault();
					const un = document.getElementById("newUsername").value;
					const pw = document.getElementById("newPassword").value;
					const rl = document.getElementById("newRole").value;
					try {
						const res = await fetch("/api/users", {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ username: un, password: pw, role: rl }),
						});
						if (res.ok) {
							document.getElementById("createUserForm").reset();
							fetchUsersList();
							fetchLeaderWorkspace();
							document.getElementById("userError").style.display = "none";
						} else {
							const data = await res.json();
							document.getElementById("userError").textContent = data.error;
							document.getElementById("userError").style.display = "block";
						}
					} catch (e) {}
				});
			}

			async function fetchUsersList() {
				try {
					const res = await fetch("/api/users");
					if (!res.ok) return;
					const { users } = await res.json();
					const grid = document.getElementById("usersListGrid");
					grid.innerHTML = "";
					users.forEach((u) => {
						grid.innerHTML += `<div style="background: var(--glass-bg); padding: 1rem; border-radius: 12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--glass-border);">
                        <div><strong style="color:#fff">${u.username}</strong><br><span style="font-size:0.8rem; color:var(--text-muted)">${u.role} | ID: ${u.id}</span></div>
                        <button onclick="deleteUser(${u.id})" class="delete-btn">Expel</button>
                    </div>`;
					});
				} catch (e) {}
			}

			async function deleteUser(uId) {
				if (
					!confirm(
						"Are you sure you want to expel this user? All their associated data will be deleted.",
					)
				)
					return;
				await fetch(`/api/users/${uId}`, { method: "DELETE" });
				refreshAll();
				fetchUsersList();
				fetchChiefTeams();
			}
		</script>
	</body>
</html>
