<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up - DevClub</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<nav>
			<div class="logo">DevClub</div>
			<a href="index.html" class="btn btn-glass">Back to Home</a>
		</nav>
		<div class="container">
			<div class="glass-panel">
				<h2 style="font-size: 2rem; margin-bottom: 2rem; text-align: center">
					Create Account
				</h2>
				<form id="signupForm">
					<div class="form-group">
						<label>Username</label>
						<input
							type="text"
							id="username"
							class="form-control"
							required
							placeholder="Choose a username"
						/>
					</div>
					<div class="form-group">
						<label>Password</label>
						<input
							type="password"
							id="password"
							class="form-control"
							required
							placeholder="Choose a strong password"
						/>
					</div>
					<div id="errorMsg" class="error-text"></div>
					<div id="successMsg" class="success-text" style="display: none"></div>
					<button
						type="submit"
						class="btn btn-primary"
						style="width: 100%; margin-top: 1rem"
					>
						Sign Up
					</button>
				</form>
				<p style="text-align: center; margin-top: 1.5rem">
					Already have an account?
					<a href="login.html">Log in here</a>
				</p>
			</div>
		</div>

		<script>
			document.getElementById("signupForm").addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = document.getElementById("username").value;
				const password = document.getElementById("password").value;
				const errorMsg = document.getElementById("errorMsg");
				const successMsg = document.getElementById("successMsg");

				errorMsg.style.display = "none";
				successMsg.style.display = "none";

				try {
					const res = await fetch("/api/signup", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ username, password }),
					});

					const data = await res.json();

					if (res.ok) {
						successMsg.textContent =
							data.message || "Account created! Redirecting to login...";
						successMsg.style.display = "block";
						setTimeout(() => {
							window.location.href = "/login.html";
						}, 2000);
					} else {
						errorMsg.textContent = data.error || "Signup failed";
						errorMsg.style.display = "block";
					}
				} catch (e) {
					errorMsg.textContent = "Network error. Please try again.";
					errorMsg.style.display = "block";
				}
			});
		</script>
	</body>
</html>
